{% extends "base.html" %}
{% block title %}View Your Wrapped - PaperWrapped{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>View Your Wrapped</h2>
    <p>Enter the access code your teacher gave you.</p>
    <form method="POST" class="auth-form">
        <div class="form-group">
            <label for="access_code">Access Code</label>
            <input type="text" id="access_code" name="access_code" required
                   placeholder="e.g. a1b2c3d4e5f6"
                   class="code-input">
        </div>
        <button type="submit" class="btn btn-primary btn-full">View My Wrapped</button>
    </form>
</div>
{% endblock %}
